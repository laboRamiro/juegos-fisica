// ---------------------------------------------------------------------------
// 6) Wiring
// ---------------------------------------------------------------------------
function HUD_wire(rootEl, { eventBus, gameFSM, inputManager } = {}) {
  const bus = eventBus || EventBus;

  const els = {
    subtitle: rootEl.querySelector('#hud-subtitle'),
    roundBadge: rootEl.querySelector('#round-badge'),
    introScreen: rootEl.querySelector('#intro-screen'),
    roundContent: rootEl.querySelector('#round-content'),
    datosBody: rootEl.querySelector('#datos-body'),
    controlTitle: rootEl.querySelector('#control-title'),
    sliderLabelText: rootEl.querySelector('#slider-label-text'),
    sliderReadoutVal: rootEl.querySelector('#slider-readout-val'),
    sliderReadoutUnit: rootEl.querySelector('#slider-readout-unit'),
    slider: rootEl.querySelector('#slider-libre'),
    kelvinReadout: rootEl.querySelector('#kelvin-readout'),
    kelvinC: rootEl.querySelector('#kelvin-c'),
    kelvinK: rootEl.querySelector('#kelvin-k'),
    previewLabel: rootEl.querySelector('#preview-label'),
    previewVal: rootEl.querySelector('#preview-val'),
    gaugeSlot: rootEl.querySelector('#gauge-slot'),
    rulerSlot: rootEl.querySelector('#ruler-slot'),
    gaugeCanvas: rootEl.querySelector('#gauge-canvas'),
    rulerCanvas: rootEl.querySelector('#ruler-canvas'),
    btnPrimary: rootEl.querySelector('#btn-primary'),
    panelResultado: rootEl.querySelector('#panel-resultado'),
    resLabelLogrado: rootEl.querySelector('#res-label-logrado'),
    resLogrado: rootEl.querySelector('#res-logrado'),
    resObjetivo: rootEl.querySelector('#res-objetivo'),
    resError: rootEl.querySelector('#res-error'),
    resCategoria: rootEl.querySelector('#res-categoria'),
    resCategoriaLabel: rootEl.querySelector('#res-categoria-label'),
    resMensaje: rootEl.querySelector('#res-mensaje'),
    resFormula: rootEl.querySelector('#res-formula'),
    chapterEndScreen: rootEl.querySelector('#chapter-end-screen'),
    chapterEndTitle: rootEl.querySelector('#chapter-end-title'),
    thLibre: rootEl.querySelector('#th-libre'),
    thLogrado: rootEl.querySelector('#th-logrado'),
    chapterEndTbody: rootEl.querySelector('#chapter-end-tbody'),
    chapterEndConclusion: rootEl.querySelector('#chapter-end-conclusion'),
    summaryScreen: rootEl.querySelector('#summary-screen'),
    summaryConclusiones: rootEl.querySelector('#summary-conclusiones'),
  };

  let capituloData = (gameFSM && gameFSM.capituloData) || CAPITULOS[0];
  let rondaData = (gameFSM && gameFSM.rondaData) || capituloData.rondas[0];
  let presentacion = PRESENTACION_CAPITULO[capituloData.clave];

  function showScreen(name) {
    els.introScreen.classList.toggle('visible', name === 'intro');
    els.roundContent.classList.toggle('visible', name === 'round');
    els.chapterEndScreen.classList.toggle('visible', name === 'chapterEnd');
    els.summaryScreen.classList.toggle('visible', name === 'summary');
  }

  // -- Pantalla de bienvenida (GameFSM.onIntroEntered, agregado en fase Publisher) --
  function showIntro() {
    showScreen('intro');
  }

  // -- Reconstruye TODO el contenido de la ronda según el capítulo activo --
  function refreshDatosRonda() {
    capituloData = (gameFSM && gameFSM.capituloData) || capituloData;
    rondaData = (gameFSM && gameFSM.rondaData) || rondaData;
    if (!capituloData || !rondaData) return;
    presentacion = PRESENTACION_CAPITULO[capituloData.clave];

    showScreen('round');
    hideResultado();

    els.subtitle.innerHTML = `Capítulo ${capituloData.id}/3 — <b>${capituloData.nombre}</b>`;
    els.roundBadge.textContent = `Ronda ${rondaData.ronda} / 3`;

    // --- panel-datos: filas distintas según el capítulo (interface-brief.md, punto 3) ---
    const unidadObjetivo = capituloData.unidadCalculada;
    if (capituloData.clave === 'boyle') {
      els.datosBody.innerHTML = `
        <div class="rrow"><span class="lbl">T (constante)</span><span class="val yellow">300 K (27°C)</span></div>
        <div class="rrow"><span class="lbl">Objetivo: P</span><span class="val yellow" id="dato-objetivo">${HUD_fmtKPa(rondaData.objetivo)} ${unidadObjetivo}</span></div>`;
    } else if (capituloData.clave === 'charles') {
      els.datosBody.innerHTML = `
        <div class="rrow"><span class="lbl">P (constante)</span><span class="val yellow">100 kPa</span></div>
        <div class="rrow"><span class="lbl">Objetivo: V</span><span class="val yellow" id="dato-objetivo">${HUD_fmtL(rondaData.objetivo)} ${unidadObjetivo}</span></div>`;
    } else {
      els.datosBody.innerHTML = `
        <div class="rrow"><span class="lbl">V (fijo, tanque rígido)</span><span class="val yellow">${HUD_fmtL(V0_REF)} L</span></div>
        <div class="rrow"><span class="lbl">Objetivo: P</span><span class="val yellow" id="dato-objetivo">${HUD_fmtKPa(rondaData.objetivo)} ${unidadObjetivo}</span></div>
        <div class="rrow"><span class="lbl">Límite de seguridad</span><span class="val red">${P_MAX_SEGURIDAD} kPa</span></div>`;
    }

    // --- panel-control: label/unidad del slider, conversión a Kelvin si aplica ---
    els.controlTitle.textContent = capituloData.variableLibre === 'V' ? 'Volumen (variable libre)' : 'Temperatura (variable libre)';
    els.sliderLabelText.textContent = presentacion.sliderLabel;
    els.sliderReadoutUnit.textContent = presentacion.sliderUnit;
    els.kelvinReadout.style.display = presentacion.showKelvin ? 'block' : 'none';
    els.previewLabel.textContent = presentacion.previewLabel;

    // --- panel-gauges: manómetro (Boyle/Gay-Lussac) o regla de volumen (Charles) ---
    const usaRuler = presentacion.medidor === 'ruler';
    els.gaugeSlot.style.display = usaRuler ? 'none' : 'block';
    els.rulerSlot.style.display = usaRuler ? 'block' : 'none';

    // --- resultado: labels específicos del capítulo ---
    els.resLabelLogrado.textContent = presentacion.resLabelLogrado;
    els.resObjetivo.textContent = `${capituloData.clave === 'charles' ? HUD_fmtL(rondaData.objetivo) : HUD_fmtKPa(rondaData.objetivo)}${presentacion.resUnit}`;

    updatePreview();
  }

  // -- Preview en vivo: usa SIEMPRE las funciones del Physicist (GasEngine) --
  function updatePreview() {
    if (!capituloData) return;
    const valorLibre = parseFloat(els.slider.value);
    const valorCalculado = capituloData.compute(valorLibre);

    const libreFmt = capituloData.clave === 'boyle' ? HUD_fmtL(valorLibre) : HUD_fmtTemp(valorLibre);
    els.sliderReadoutVal.textContent = libreFmt;

    if (presentacion.showKelvin) {
      const tK = toKelvin(valorLibre);
      els.kelvinC.textContent = HUD_fmtTemp(valorLibre);
      els.kelvinK.textContent = HUD_fmtTemp(tK);
    }

    const calcFmt = capituloData.clave === 'charles' ? HUD_fmtL(valorCalculado) : HUD_fmtKPa(valorCalculado);
    els.previewVal.textContent = `${calcFmt}${presentacion.previewUnit}`;

    // Medidor en vivo durante SETUP (fase de preview, antes de accionar).
    if (presentacion.medidor === 'ruler') {
      HUD_renderRuler(els.rulerCanvas, valorCalculado, 4.0);
    } else {
      const limite = capituloData.limiteSeguridad; // undefined en Boyle, 200 en Gay-Lussac
      HUD_renderGauge(els.gaugeCanvas, 'P', valorCalculado, GAUGE_PRESION_MAX, limite);
    }
  }

  function hideResultado() {
    els.panelResultado.classList.remove('visible');
  }

  function showResultado(payload) {
    const info = CATEGORIA_INFO[payload.categoria];
    const esCharles = capituloData.clave === 'charles';
    const logradoFmt = esCharles ? HUD_fmtL(payload.valorLogrado) : HUD_fmtKPa(payload.valorLogrado);
    const errorPct = (payload.error * 100).toFixed(1);

    els.resLogrado.textContent = `${logradoFmt}${presentacion.resUnit}`;
    els.resLogrado.className = `val ${info.claseVal}`;
    els.resError.textContent = `${errorPct}%`;
    els.resError.className = `val ${info.claseVal}`;

    els.resCategoria.style.background = `${info.color}26`;
    els.resCategoria.style.border = `1px solid ${info.color}66`;
    els.resCategoria.style.color = info.color;
    els.resCategoriaLabel.textContent = info.label;
    els.resMensaje.textContent = HUD_getCategoriaMensaje(payload.categoria, payload.sobra, payload.exploto);
    els.resFormula.innerHTML = presentacion.formula(payload.valorLibre, payload.valorLogrado);
    if (payload.exploto) {
      // Aclaración numérica explícita: la explosión es por superar el límite de
      // seguridad, no (solo) por el error contra el objetivo de la ronda — el
      // jugador debe ver el número que cruzó la línea, no solo leerlo en abstracto.
      els.resFormula.innerHTML += `<br><b style="color:#ff1744">${HUD_fmtKPa(payload.valorLogrado)} kPa supera el límite de seguridad de ${P_MAX_SEGURIDAD} kPa.</b>`;
    }

    // Medidor final con el valor logrado (no el preview) — refleja el resultado real.
    if (presentacion.medidor === 'ruler') {
      HUD_renderRuler(els.rulerCanvas, payload.valorLogrado, 4.0);
    } else {
      HUD_renderGauge(els.gaugeCanvas, 'P', payload.valorLogrado, GAUGE_PRESION_MAX, capituloData.limiteSeguridad);
    }

    els.panelResultado.classList.add('visible');
  }

  function showChapterEnd(capituloId, resultadosCapitulo) {
    const cap = CAPITULOS[capituloId - 1];
    const pres = PRESENTACION_CAPITULO[cap.clave];
    els.chapterEndTitle.textContent = `Fin del experimento — ${cap.nombre}`;
    els.thLibre.textContent = cap.variableLibre === 'V' ? 'V usado' : 'T usado';
    els.thLogrado.textContent = pres.resLabelLogrado;

    els.chapterEndTbody.innerHTML = resultadosCapitulo.map((r) => {
      const info = CATEGORIA_INFO[r.categoria];
      const libreFmt = cap.clave === 'boyle' ? HUD_fmtL(r.valorLibre) : HUD_fmtTemp(r.valorLibre);
      const logradoFmt = cap.clave === 'charles' ? HUD_fmtL(r.valorLogrado) : HUD_fmtKPa(r.valorLogrado);
      return `<tr>
        <td>${r.ronda}</td>
        <td>${libreFmt}${cap.clave === 'boyle' ? ' L' : ' °C'}</td>
        <td>${logradoFmt}${pres.resUnit}</td>
        <td style="color:${info.color};font-weight:bold;">${info.label}</td>
      </tr>`;
    }).join('');

    els.chapterEndConclusion.innerHTML = CONCLUSION_CAPITULO[cap.clave];
    showScreen('chapterEnd');
  }

  function showSummary(resultados) {
    const constanteCombinada = ((P0_REF * V0_REF) / T0_REF).toFixed(4);
    rootEl.querySelector('#summary-constante').textContent = constanteCombinada;

    els.summaryConclusiones.innerHTML = CAPITULOS.map((cap) => `
      <div class="conclusion-item"><b>${cap.nombre}:</b> ${CONCLUSION_CAPITULO[cap.clave]}</div>
    `).join('');

    showScreen('summary');
  }

  // -- Suscripciones EventBus (nombres EXACTOS del contrato común) --
  bus.on(EVENTS.SLIDER_CHANGED, () => updatePreview());

  bus.on(EVENTS.ROUND_RESOLVED, (payload) => showResultado(payload));

  bus.on(EVENTS.CHAPTER_END_REACHED, (payload) => {
    const resultadosCapitulo = (gameFSM ? gameFSM.resultados : []).filter((r) => r.capituloId === payload.capituloId);
    showChapterEnd(payload.capituloId, resultadosCapitulo);
  });

  bus.on(EVENTS.GAME_SUMMARY_READY, (payload) => showSummary(payload.resultados));

  // El input "vivo" del slider lo emite InputManager; acá solo escuchamos.
  if (!inputManager) {
    els.slider.addEventListener('input', () => {
      bus.emit(EVENTS.SLIDER_CHANGED, { valor: parseFloat(els.slider.value) });
    });
  }

  return { refreshDatosRonda, updatePreview, showResultado, hideResultado, showIntro, showChapterEnd, showSummary };
}

// Hooks que el Publisher debe registrar en gameFSM (no son eventos nuevos del
// contrato común, son llamadas directas — mismo patrón que Hidrodinámica):
//   gameFSM.onIntroEntered = () => hudApi.showIntro();
//   gameFSM.onRoundChanged = () => hudApi.refreshDatosRonda();
//   gameFSM.onActionButtonLabel = () => PRESENTACION_CAPITULO[gameFSM.capituloData.clave].botonLabel;

// ---------------------------------------------------------------------------
// 7) Manómetro / regla — call-site documentado para el Artist. Si drawPressureGauge
//    / drawVolumeRuler todavía no existen en window, se usa un fallback mínimo para
//    no romper el juego ni dejar los canvases en blanco.
// ---------------------------------------------------------------------------
function HUD_renderGauge(canvasEl, label, presionKPa, presionMax, limiteSeguridad) {
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  const cx = canvasEl.width / 2;
  const cy = canvasEl.height / 2;
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

  if (typeof drawPressureGauge === 'function') {
    drawPressureGauge(ctx, cx, cy, label, presionKPa, presionMax, limiteSeguridad);
    return;
  }

  // --- Fallback mínimo (solo hasta que el Artist entregue drawPressureGauge) ---
  ctx.fillStyle = '#f5f0e6';
  ctx.beginPath(); ctx.arc(cx, cy, Math.min(cx, cy) - 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a4654'; ctx.lineWidth = 2; ctx.stroke();
  const pct = Math.max(0, Math.min(1, presionKPa / presionMax));
  const angle = Math.PI * 0.75 + pct * Math.PI * 1.5;
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angle) * (Math.min(cx, cy) - 12), cy + Math.sin(angle) * (Math.min(cx, cy) - 12));
  ctx.stroke();
  ctx.fillStyle = '#0a1628'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${HUD_fmtKPa(presionKPa)} kPa`, cx, cy + Math.min(cx, cy) - 8);
}

function HUD_renderRuler(canvasEl, volumenL, volumenMax) {
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

  if (typeof drawVolumeRuler === 'function') {
    drawVolumeRuler(ctx, 10, 10, volumenL, volumenMax);
    return;
  }

  // --- Fallback mínimo ---
  const frac = Math.max(0, Math.min(1, volumenL / volumenMax));
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(10, 10, 30, 140);
  ctx.fillStyle = '#64b5f6'; ctx.fillRect(13, 10 + 140 * (1 - frac), 24, 140 * frac - 3);
  ctx.fillStyle = '#9ac'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${HUD_fmtL(volumenL)} L`, 44, 10 + 140 * (1 - frac));
}

// ---------------------------------------------------------------------------
// Orden de carga sugerido al Publisher en el <script> final:
//   EventBus.js -> GasEngine.js -> GasParticles.js -> Drawing.js (Artist) ->
//   GameFSM.js -> GameLoop.js -> InputManager.js -> HUD.js -> bootstrap (main.js)
// ---------------------------------------------------------------------------

// main.js — Gases Ideales: El Laboratorio de Presión
// Rol: Publisher. Bootstrap + audio mínimo (Web Audio API) + render loop.
// SIN import/export ES6 — bloque plano, último en cargarse del <script> final.

// ---------------------------------------------------------------------------
// Audio mínimo (Web Audio API). El AudioContext se crea recién al primer click
// del usuario (gesto real), nunca antes — evita el bloqueo de autoplay.
// ---------------------------------------------------------------------------
function createAudioEngine() {
  let ctx = null;
  let heatSource = null;

  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  function startHeating() {
    const ac = ensureCtx();
    stopHeating();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 90;
    gain.gain.value = 0.025;
    osc.connect(gain).connect(ac.destination);
    osc.start();
    heatSource = { osc, gain };
  }

  function stopHeating() {
    if (heatSource) {
      try { heatSource.osc.stop(); } catch (e) { /* ya detenido */ }
      heatSource.osc.disconnect();
      heatSource.gain.disconnect();
      heatSource = null;
    }
  }

  function playResultSound(categoria, exploto) {
    const ac = ensureCtx();
    const now = ac.currentTime;

    if (exploto) {
      // "Boom" de explosión: ruido filtrado + golpe grave corto.
      const bufferSize = ac.sampleRate * 0.5;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const noise = ac.createBufferSource();
      noise.buffer = buffer;
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      noise.connect(filter).connect(gain).connect(ac.destination);
      noise.start(now);

      const thump = ac.createOscillator();
      const thumpGain = ac.createGain();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(120, now);
      thump.frequency.exponentialRampToValueAtTime(35, now + 0.35);
      thumpGain.gain.setValueAtTime(0.4, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      thump.connect(thumpGain).connect(ac.destination);
      thump.start(now);
      thump.stop(now + 0.45);
      return;
    }

    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain).connect(ac.destination);
    const esBueno = categoria === 'optima' || categoria === 'aceptable';

    if (esBueno) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.14, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.45);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.13, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    }
    osc.start(now);
    osc.stop(now + 0.55);
  }

  return { startHeating, stopHeating, playResultSound };
}

// ---------------------------------------------------------------------------
// Easing simple para la animación del pistón/temperatura durante RUNNING.
// ---------------------------------------------------------------------------
function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// ---------------------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------------------
function main() {
  const canvas = document.getElementById('game-canvas');
  canvas.width = CANVAS_WIDTH;
  canvas.height = CANVAS_HEIGHT;
  const ctx = canvas.getContext('2d');

  const sidePanelMount = document.getElementById('side-panel-mount');
  const hudRoot = HUD_buildPanel(sidePanelMount);
  const sliderEl = hudRoot.querySelector('#slider-libre');
  const actionButtonEl = hudRoot.querySelector('#btn-primary');

  const inputManager = new InputManager({ sliderEl, actionButtonEl });
  const gameFSM = new GameFSM({ inputManager });
  inputManager.gameFSM = gameFSM;

  const audio = createAudioEngine();
  const hudApi = HUD_wire(hudRoot, { gameFSM, inputManager });

  resetParticles();

  // --- Estado visual del aparato (pistón/temperatura), animado durante RUNNING ---
  // Cada ronda arranca SIEMPRE desde el valor inicial de referencia del capítulo
  // (capituloData.sliderInicial) y anima hacia el valor que el jugador fijó con el
  // slider (gameFSM.valorLibreActual) — refuerza la idea de "siempre partís del
  // mismo estado de referencia" que ya presenta la pantalla de INTRO.
  let anim = { from: CAPITULOS[0].sliderInicial, to: CAPITULOS[0].sliderInicial, startSec: 0, activo: false };
  let explosion = { activa: false, startSec: 0 };
  let elapsedSec = 0;

  gameFSM.onIntroEntered = () => {
    hudApi.showIntro();
    resetParticles();
  };

  gameFSM.onRoundChanged = () => {
    hudApi.refreshDatosRonda();
    anim = { from: gameFSM.capituloData.sliderInicial, to: gameFSM.capituloData.sliderInicial, startSec: elapsedSec, activo: false };
    explosion.activa = false;
    audio.stopHeating();
  };

  gameFSM.onActionButtonLabel = () => {
    const clave = gameFSM.capituloData ? gameFSM.capituloData.clave : 'boyle';
    return PRESENTACION_CAPITULO[clave].botonLabel;
  };

  // Al disparar la acción (botón primario en SETUP), arrancar la animación de
  // transición del estado visual — se detecta el cambio de estado SETUP->RUNNING
  // después de que GameFSM (registrado antes que main.js en el <script> final)
  // ya proceso el evento y mutó this.fsm.state (mismo truco que Hidrodinámica).
  EventBus.on(EVENTS.ACTION_TRIGGERED, () => {
    if (gameFSM.state !== 'RUNNING') return;
    const cap = gameFSM.capituloData;
    anim = {
      from: cap.sliderInicial,
      to: gameFSM.valorLibreActual,
      startSec: elapsedSec,
      activo: true,
    };
    if (cap.clave !== 'boyle' && anim.to > anim.from) {
      audio.startHeating();
    }
  });

  EventBus.on(EVENTS.ROUND_RESOLVED, (payload) => {
    audio.stopHeating();
    audio.playResultSound(payload.categoria, payload.exploto);
    anim.activo = false; // queda fijo en el valor final (anim.to)
    if (payload.exploto) {
      explosion = { activa: true, startSec: elapsedSec };
    }
  });

  // --- Loop principal ---
  const loop = new GameLoop({ fixedHz: TARGET_FPS });

  // Calcula el estado visual del frame actual (valor libre animado, T_C, volumen
  // relativo) a partir de `anim` — usado tanto por onFixedUpdate (partículas) como
  // por onDraw (dibujo), para no duplicar la cuenta entre ambos callbacks.
  function computeFrameState() {
    const cap = gameFSM.capituloData || CAPITULOS[0];
    let valorLibreVisual = anim.to;
    if (anim.activo) {
      const t = Math.min(1, (elapsedSec - anim.startSec) / (ANIMATION_DURATION_MS / 1000));
      valorLibreVisual = anim.from + (anim.to - anim.from) * easeInOutQuad(t);
    }
    const esBoyle = cap.clave === 'boyle';
    const T_C = esBoyle ? 27 : valorLibreVisual;
    const V_actual = esBoyle ? valorLibreVisual : (cap.clave === 'charles' ? computeV_charles(valorLibreVisual) : V0_REF);
    const volumenRelativo = cap.clave === 'gaylussac' ? 1.0 : Math.max(0.08, Math.min(1.0, V_actual / V0_REF));
    return { cap, esBoyle, valorLibreVisual, T_C, volumenRelativo };
  }

  loop.onFixedUpdate = (dt) => {
    elapsedSec += dt;
    gameFSM.update(dt);
    const frame = computeFrameState();
    updateParticles(dt, { T_C: frame.T_C, volumenRelativo: frame.volumenRelativo });
  };

  loop.onDraw = () => render(computeFrameState());

  // --- Composición de escena: fondo + grilla, igual convención del portal ---
  function drawSceneBackground() {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.strokeStyle = 'rgba(135,206,235,0.07)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= CANVAS_WIDTH; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_HEIGHT); ctx.stroke();
    }
    for (let y = 0; y <= CANVAS_HEIGHT; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_WIDTH, y); ctx.stroke();
    }
  }

  function render(frame) {
    drawSceneBackground();

    const { cap, esBoyle, valorLibreVisual, T_C, volumenRelativo } = frame;

    if (cap.clave === 'gaylussac') {
      drawSealedTank(ctx);
    } else {
      drawCylinder(ctx, volumenRelativo, cap.clave);
    }

    drawGasParticles(ctx, particulas, gasColorForTemperature(T_C));

    // Llama del mechero: solo mientras se está calentando activamente en RUNNING.
    if (cap.clave !== 'boyle' && gameFSM.state === 'RUNNING' && anim.to > anim.from) {
      const tAnim = Math.min(1, (elapsedSec - anim.startSec) / (ANIMATION_DURATION_MS / 1000));
      const flameX = cap.clave === 'charles' ? GAS_RECT.x + GAS_RECT.w * 0.35 : GAS_RECT.x + GAS_RECT.w * 0.5;
      const flameY = GAS_RECT.y + GAS_RECT.h + CYL_WALL + 34;
      drawFlame(ctx, flameX, flameY, Math.min(1, tAnim + 0.2));
    }

    // Explosión del tanque (solo Gay-Lussac, exploto:true) — ~0.8s superpuesta.
    if (explosion.activa) {
      const tExp = (elapsedSec - explosion.startSec) / 0.8;
      if (tExp <= 1) {
        drawTankExplosion(ctx, GAS_RECT.x + GAS_RECT.w * 0.5, GAS_RECT.y + GAS_RECT.h * 0.5, tExp);
      } else {
        explosion.activa = false;
      }
    }

    // Etiqueta rápida sobre el diagrama (refuerzo visual, el panel ya muestra más detalle).
    ctx.fillStyle = '#87ceeb';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    const unidadLibre = esBoyle ? 'L' : '°C';
    ctx.fillText(`${cap.variableLibre} = ${valorLibreVisual.toFixed(esBoyle ? 2 : 0)} ${unidadLibre}`, GAS_RECT.x + GAS_RECT.w / 2, GAS_RECT.y - 24);
  }

  loop.start();
  gameFSM.start();
}

window.addEventListener('load', main);


  </script>
