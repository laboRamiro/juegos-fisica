<style>/* ../../comunes/ui/estilos-comunes.css */
:root {
  /* Paleta fría oscura (definida por el usuario el 2026-07-18) — ver
     PLAN.md §9. El naranja es el único acento cálido: se reserva para
     botones y elementos que deben llamar la atención, nunca decoración. */
  --azul-marino: #191A2D;
  --turquesa: #46A9A4;
  --marron-madera: #5A3E26;
  --marron-oscuro: #2B2520;
  --azul-acero: #325365;
  --verde-azulado: #507C74;
  --negro: #0A0A0D;
  --naranja: #DA5D29;

  --color-fondo: var(--azul-marino);
  --color-tarjeta: var(--marron-madera);
  --color-texto: #ECE7DC;
  --color-borde: var(--turquesa);
  --radio-borde: 12px;
  --sombra-suave: 0 2px 8px rgba(0, 0, 0, 0.35);
  --fuente-base: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Fuentes de sistema (offline-first) para el tono "retro" de la intro y la
     mascota — ver skill art-direction (evita Google Fonts vía CDN). */
  --pixel-madera-oscura: var(--marron-oscuro);
  --pixel-madera-clara: var(--marron-madera);
  --pixel-pergamino: var(--azul-acero);
  --pixel-sombra: var(--negro);
  --pixel-dorado: var(--naranja);
  --pixel-exito: #4CAF50;
  --pixel-peligro: #B52121;
  --fuente-pixel-titulo: 'Trebuchet MS', 'Segoe UI', sans-serif;
  --fuente-pixel-texto: 'Courier New', 'Consolas', monospace;
}

body {
  margin: 0;
  font-family: var(--fuente-base);
  color: var(--color-texto);
  background: var(--color-fondo);
}

.panel {
  background: var(--color-tarjeta);
  border: 1px solid var(--color-borde);
  border-radius: var(--radio-borde);
  box-shadow: var(--sombra-suave);
  padding: 16px;
  color: var(--color-texto);
}

.boton {
  font-family: var(--fuente-base);
  border: none;
  border-radius: var(--radio-borde);
  padding: 10px 18px;
  font-size: 15px;
  cursor: pointer;
  background: var(--naranja);
  color: #fff;
}

.boton:hover {
  opacity: 0.85;
}

.boton:disabled {
  background: var(--marron-oscuro);
  color: var(--color-texto);
  opacity: 0.5;
  cursor: not-allowed;
}

.ui-slider {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}

.ui-slider label {
  font-size: 14px;
}

.panel-metricas .metrica-fila {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  padding: 2px 0;
}

.selector-nivel {
  display: flex;
  gap: 8px;
}

.chip-nivel {
  font-family: var(--fuente-base);
  border: 1px solid var(--color-borde);
  background: var(--color-tarjeta);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
}

.chip-nivel.activo {
  background: var(--color-texto);
  color: var(--color-tarjeta);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-overlay.oculto {
  display: none;
}

.modal-contenido {
  max-width: 420px;
  width: 90%;
}

.modal-contenido h4 {
  margin-bottom: 4px;
}

.modal-contenido p {
  margin-top: 0;
}

/* --- Personaje guía (Newtín, mascota recurrente) --- */

.personaje-guia {
  position: fixed;
  left: 16px;
  bottom: 16px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  z-index: 50;
  pointer-events: none;
}

.personaje-guia canvas {
  width: 72px;
  height: 72px;
}

.burbuja-dialogo {
  background: var(--pixel-pergamino);
  border: 3px solid var(--pixel-madera-oscura);
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
  border-radius: 10px;
  padding: 8px 12px;
  font-family: var(--fuente-pixel-texto);
  font-size: 13px;
  max-width: 220px;
  color: var(--color-texto);
}

/* --- Animación final de celebración --- */

.animacion-final {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 200;
}

.animacion-final.oculto {
  display: none;
}

.animacion-final-icono {
  font-size: 64px;
  color: var(--pixel-dorado);
  opacity: 0;
  text-shadow: 0 0 12px rgba(255, 217, 33, 0.8);
}

.animacion-final-activa .animacion-final-icono {
  animation: celebrar-final 1.1s ease-out;
}

@keyframes celebrar-final {
  0%   { transform: scale(0.4) rotate(0deg); opacity: 0; }
  25%  { transform: scale(1.3) rotate(-10deg); opacity: 1; }
  50%  { transform: scale(1.15) rotate(10deg); opacity: 1; }
  75%  { transform: scale(1.05) rotate(-5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 0; }
}

/* --- Escena de introducción (contexto histórico) --- */

.escena-intro {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0;
  z-index: 150;
}

.escena-intro-fondo {

  width: 90%;
  height: auto;
  border-radius: var(--radio-borde) var(--radio-borde) 0 0;
  display: block;
}

.escena-intro-tarjeta {
  max-width: 600px;
  width: 90%;
  background: var(--pixel-pergamino);
  border: 4px solid var(--pixel-madera-oscura);
  border-top: none;
  box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);

  color: var(--color-texto);
}

  letter-spacing: 0.03em;
  margin: 0 0 8px;
}

.escena-intro-texto {
  font-family: var(--fuente-pixel-texto);

<script>/* ../../comunes/fisica/vector2.js */
window.Fisica = window.Fisica || {};

window.Fisica.Vector2 = class Vector2 {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }

  add(v) { return new window.Fisica.Vector2(this.x + v.x, this.y + v.y); }
  sub(v) { return new window.Fisica.Vector2(this.x - v.x, this.y - v.y); }
  scale(s) { return new window.Fisica.Vector2(this.x * s, this.y * s); }
  dot(v) { return this.x * v.x + this.y * v.y; }
  clone() { return new window.Fisica.Vector2(this.x, this.y); }

  get magnitud() { return Math.hypot(this.x, this.y); }

  normalizado() {
    const m = this.magnitud;
    return m === 0 ? new window.Fisica.Vector2(0, 0) : this.scale(1 / m);
  }
};

</script>

<script>/* ../../comunes/motor/GameLoop.js */
window.Motor = window.Motor || {};

// Loop de juego sobre requestAnimationFrame, con dt limitado para evitar saltos
// grandes si la pestaña pierde el foco.
window.Motor.GameLoop = class GameLoop {
  constructor({ actualizar, dibujar, dtMaximo = 1 / 30 }) {
    this.actualizar = actualizar;
    this.dibujar = dibujar;
    this.dtMaximo = dtMaximo;
    this.corriendo = false;
    this.ultimoTiempo = 0;
    this._frame = this._frame.bind(this);
  }

  iniciar() {
    if (this.corriendo) return;
    this.corriendo = true;
    this.ultimoTiempo = performance.now();
    requestAnimationFrame(this._frame);
  }

  detener() {
    this.corriendo = false;
  }

  _frame(tiempoActual) {
    if (!this.corriendo) return;
    const dt = Math.min((tiempoActual - this.ultimoTiempo) / 1000, this.dtMaximo);
    this.ultimoTiempo = tiempoActual;
    this.actualizar(dt);
    this.dibujar();
    requestAnimationFrame(this._frame);
  }
};

</script>
<script>/* ../../comunes/motor/PixelArt.js */
window.Motor = window.Motor || {};

// Helpers de dibujo estilo pixel art (ver skill art-direction, estilo Stardew
// Pixel). No usa sprites cargados: todo se dibuja con primitivas de Canvas,
// igual que el prototipo Phaser descartado (arquimedes-barca) dibujaba con
// Graphics — acá con ctx nativo, sin dependencias.
window.Motor.PixelArt = {
  TILE: 16,
  ESCALA: 3,

  rectanguloBloques(ctx, x, y, anchoBloques, altoBloques, color, escala = window.Motor.PixelArt.ESCALA) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, anchoBloques * escala, altoBloques * escala);
  },

  // Patrón de sombra tipo damero (dithering), en vez de un gradiente suave.
  sombraDitherizada(ctx, x, y, anchoBloques, altoBloques, color, escala = window.Motor.PixelArt.ESCALA) {
    ctx.fillStyle = color;
    for (let py = 0; py < altoBloques; py++) {
      for (let px = 0; px < anchoBloques; px++) {
        if ((px + py) % 2 === 0) {
          ctx.fillRect(x + px * escala, y + py * escala, escala, escala);
        }
      }
    }
  },
};

</script>

<script>/* ../../comunes/ui/Slider.js */
window.UI = window.UI || {};

window.UI.Slider = class Slider {
  constructor({ contenedor, etiqueta, min, max, valorInicial, paso = 1, unidad = '', onChange }) {
    this.onChange = onChange;
    this.etiqueta = etiqueta;
    this.unidad = unidad;

    this.raiz = document.createElement('div');
    this.raiz.className = 'ui-slider';

    this.etiquetaElemento = document.createElement('label');
    this._actualizarEtiqueta(valorInicial);

    this.input = document.createElement('input');
    this.input.type = 'range';
    this.input.min = min;
    this.input.max = max;
    this.input.step = paso;
    this.input.value = valorInicial;

    this.input.addEventListener('input', () => {
      const valor = parseFloat(this.input.value);
      this._actualizarEtiqueta(valor);
      this.onChange(valor);
    });

    this.raiz.appendChild(this.etiquetaElemento);
    this.raiz.appendChild(this.input);
    contenedor.appendChild(this.raiz);
  }

  _actualizarEtiqueta(valor) {
    this.etiquetaElemento.textContent = `${this.etiqueta}: ${valor} ${this.unidad}`.trim();
  }

  get valor() {
    return parseFloat(this.input.value);
  }
};

<script>/* ../../comunes/ui/GraficoLinea.js */
window.UI = window.UI || {};

// Mini gráfico canvas de variable-vs-tiempo, con buffer de puntos de tamaño fijo.
window.UI.GraficoLinea = class GraficoLinea {
  constructor({ canvas, maxPuntos = 200, min, max, color = '#2f6fed' }) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.maxPuntos = maxPuntos;
    this.min = min;
    this.max = max;
    this.color = color;
    this.puntos = [];
  }

  agregarPunto(valor) {
    this.puntos.push(valor);
    if (this.puntos.length > this.maxPuntos) this.puntos.shift();
    this._dibujar();
  }

  _dibujar() {
    const { ctx, canvas } = this;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.beginPath();

    this.puntos.forEach((valor, i) => {
      const x = (i / this.maxPuntos) * canvas.width;
      const t = window.Utilidades.clamp((valor - this.min) / (this.max - this.min), 0, 1);
      const y = canvas.height - t * canvas.height;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });

    ctx.stroke();
  }
};

</script>

window.UI = window.UI || {};

// Chips de "Explorar / Desafío / Predicción" — ver PLAN.md §6.
window.UI.SelectorNivel = class SelectorNivel {
  constructor({ contenedor, onCambio }) {
    const niveles = [
      { clave: 'explorar', etiqueta: 'Explorar libre' },
      { clave: 'desafio', etiqueta: 'Desafío guiado' },
      { clave: 'prediccion', etiqueta: 'Predicción' },

    this.raiz = document.createElement('div');

    niveles.forEach(({ clave, etiqueta }) => {
      const chip = document.createElement('button');
      chip.className = 'chip-nivel';
      chip.textContent = etiqueta;
      chip.addEventListener('click', () => {
        this.raiz.querySelectorAll('.chip-nivel').forEach((c) => c.classList.remove('activo'));
        chip.classList.add('activo');
        onCambio(clave);
      });
      this.raiz.appendChild(chip);

<script>/* ../../comunes/ui/PersonajeGuia.js */
window.UI = window.UI || {};

// Newtín, el búho guía — mascota recurrente de toda la biblioteca (arquetipo
// "Científico Guía" de la skill character). Aparece en una esquina con un
// globo de diálogo contextual y nunca interrumpe el juego, solo comenta.
window.UI.PersonajeGuia = class PersonajeGuia {
  constructor({ contenedor, dialogos }) {
    this.dialogos = dialogos;
    this.estado = 'neutral'; // 'neutral' | 'celebrando'
    this.tiempo = 0;
    this.proximoParpadeo = 2 + Math.random() * 2;
    this.parpadeando = false;
    this.activo = true;

    this.raiz = document.createElement('div');
    this.raiz.className = 'personaje-guia';

    this.canvas = document.createElement('canvas');
    this.canvas.width = 72;
    this.canvas.height = 72;
    this.ctx = this.canvas.getContext('2d');

    this.burbuja = document.createElement('div');
    this.burbuja.className = 'burbuja-dialogo';

    this.raiz.appendChild(this.canvas);
    this.raiz.appendChild(this.burbuja);
    contenedor.appendChild(this.raiz);

    this.decir('gameStart');
    this._animar = this._animar.bind(this);
    requestAnimationFrame(this._animar);
  }

  decir(situacion) {
    const opciones = this.dialogos[situacion];
    if (!opciones || opciones.length === 0) return;
    this.burbuja.textContent = opciones[Math.floor(Math.random() * opciones.length)];
  }

  celebrar() {
    this.estado = 'celebrando';
    this.tiempo = 0;
    setTimeout(() => { this.estado = 'neutral'; }, 1200);
  }

  destruir() {
    this.activo = false;
    this.raiz.remove();
  }

  _dibujar() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, 72, 72);

    const salto = this.estado === 'celebrando' ? Math.abs(Math.sin(this.tiempo * 8)) * 10 : 0;
    const cx = 36;
    const cy = 44 - salto;

    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 20, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#F5E6C8';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 4, 12, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    const aleteo = Math.sin(this.tiempo * 4) * 4;
    ctx.fillStyle = '#6B3710';
    ctx.beginPath();
    ctx.ellipse(cx - 20, cy + 2 + aleteo, 7, 14, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 20, cy + 2 - aleteo, 7, 14, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy - 20);
    ctx.lineTo(cx - 6, cy - 30);
    ctx.lineTo(cx - 2, cy - 18);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 12, cy - 20);
    ctx.lineTo(cx + 6, cy - 30);
    ctx.lineTo(cx + 2, cy - 18);
    ctx.fill();

    const ojoAbierto = !this.parpadeando;
    ctx.fillStyle = '#FFFFFF';
    [-9, 9].forEach((dx) => {
      ctx.beginPath();
      ctx.ellipse(cx + dx, cy - 8, 8, ojoAbierto ? 8 : 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    if (ojoAbierto) {
      ctx.fillStyle = '#2C1810';
      [-9, 9].forEach((dx) => {
        ctx.beginPath();
        ctx.arc(cx + dx, cy - 8, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    ctx.fillStyle = '#E8A020';
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy - 2);
    ctx.lineTo(cx + 4, cy - 2);
    ctx.lineTo(cx, cy + 5);
    ctx.fill();
  }

  _animar() {
    if (!this.activo) return;
    const dt = 1 / 60;
    this.tiempo += dt;

    if (this.tiempo >= this.proximoParpadeo && !this.parpadeando) {
      this.parpadeando = true;
      setTimeout(() => { this.parpadeando = false; }, 120);
      this.proximoParpadeo = this.tiempo + 2 + Math.random() * 3;
    }

    this._dibujar();
    requestAnimationFrame(() => this._animar());
  }
};

</script>
<script>/* ../../comunes/ui/AnimacionFinal.js */
window.UI = window.UI || {};

// Animación de celebración al completar un desafío (skill character,
// celebrationAnimation). Overlay breve y no bloqueante, se auto-oculta.
window.UI.AnimacionFinal = class AnimacionFinal {
  constructor() {
    this.overlay = document.createElement('div');
    this.overlay.className = 'animacion-final oculto';
    this.overlay.innerHTML = '<div class="animacion-final-icono">★</div>';
    document.body.appendChild(this.overlay);
  }

  reproducir() {
    this.overlay.classList.remove('oculto');
    this.overlay.classList.remove('animacion-final-activa');
    void this.overlay.offsetWidth; // fuerza reflow para poder re-disparar la animación
    this.overlay.classList.add('animacion-final-activa');
    setTimeout(() => this.overlay.classList.add('oculto'), 1200);
  }
};

</script>
<script>/* ../../comunes/ui/EscenaIntro.js */
window.UI = window.UI || {};

// Tarjeta de introducción: contexto histórico + fondo temático dibujado a
// mano, antes de empezar a jugar. Se cierra con "Comenzar" y no vuelve a
// aparecer sola (ver PLAN.md — complejidad artística, contexto histórico).
window.UI.EscenaIntro = class EscenaIntro {
  constructor({ titulo, contextoHistorico, dibujarFondo, onComenzar }) {
    this.overlay = document.createElement('div');
    this.overlay.className = 'escena-intro';

    this.canvas = document.createElement('canvas');
    this.canvas.width = 600;
    this.canvas.height = 200;
    this.canvas.className = 'escena-intro-fondo';

    const tarjeta = document.createElement('div');
    tarjeta.className = 'escena-intro-tarjeta';
    tarjeta.innerHTML = `
      <h2>${titulo}</h2>
      <p class="escena-intro-texto">${contextoHistorico}</p>
      <button class="boton" data-comenzar>Comenzar</button>
    `;

    this.overlay.appendChild(this.canvas);
    this.overlay.appendChild(tarjeta);
    document.body.appendChild(this.overlay);

    if (dibujarFondo) dibujarFondo(this.canvas.getContext('2d'), this.canvas.width, this.canvas.height);

    tarjeta.querySelector('[data-comenzar]').addEventListener('click', () => {
      this.overlay.remove();
      if (onComenzar) onComenzar();
    });
  }
};

</script>
<script>/* script.js */
(function () {
  const G = window.Fisica.GRAVEDAD_TIERRA;
  const LONGITUD_TABLA = 4; // m
  const ESCALA_PX_POR_M = 100;
  const X_IZQ_PX = 50;
  const Y_TABLA = 150;
  const Y_PISO = 200;

  const NIVELES = {
    explorar: {},
    desafio: { fraccionObjetivoDerecha: 0.75, tolerancia: 0.05 },
    prediccion: { masa: 20, posicion: 3.8 },
  };

  const estado = {
    nivel: 'explorar',
    masaPeso: 15,
    posicionPeso: 2,
    fase: 'quieto', // 'quieto' | 'evaluado'
    prediccionJugador: null,
    exploracionCount: 0,
    logroDesafio: false,
    logroPrediccion: false,
    intentosFallidos: 0,
    discoveryDicho: false,
    expresion: 'neutral', // 'neutral' | 'feliz' | 'triste'
  };

  let guia = null;
  let animacionFinal = null;

  const canvasEscena = document.getElementById('canvasEscena');
  const ctxEscena = canvasEscena.getContext('2d');
  const metaTextoEl = document.getElementById('metaTexto');
  const resultadoEl = document.getElementById('resultado');
  const controlesEl = document.getElementById('controles');
  const btnProbar = document.getElementById('btnProbar');
  const btnReiniciar = document.getElementById('btnReiniciar');

  let sliderMasa = null;
  let sliderPosicion = null;

  const panelMetricas = new window.UI.PanelMetricas({
    contenedor: document.getElementById('metricas'),
    metricas: [
      { clave: 'apoyoIzq', etiqueta: 'Apoyo izquierdo soporta', unidad: 'N' },
      { clave: 'apoyoDer', etiqueta: 'Apoyo derecho soporta', unidad: 'N' },
    ],
  });

  function reaccionDerecha(masa, posicion) { return (masa * G * posicion) / LONGITUD_TABLA; }
  function reaccionIzquierda(masa, posicion) { return masa * G - reaccionDerecha(masa, posicion); }

  function construirControles(nivel) {
    controlesEl.innerHTML = '';

    if (nivel === 'prediccion') {
      const contenedorEleccion = document.createElement('div');
      contenedorEleccion.className = 'eleccion-prediccion';

      const opciones = [
        { clave: 'cercano', texto: 'El apoyo derecho (el más cercano) soporta casi todo el peso' },
        { clave: 'igual', texto: 'Los dos apoyos soportan lo mismo, sin importar dónde esté el peso' },
      ];

      opciones.forEach(({ clave, texto }) => {
        const boton = document.createElement('button');
        boton.className = 'boton';
        boton.textContent = texto;
        boton.addEventListener('click', () => {
          estado.prediccionJugador = clave;
          contenedorEleccion.querySelectorAll('.boton').forEach((b) => b.classList.remove('activo'));
          boton.classList.add('activo');
          btnProbar.disabled = false;
        });
        contenedorEleccion.appendChild(boton);
      });

      controlesEl.appendChild(contenedorEleccion);
      btnProbar.disabled = true;
      return;
    }

    btnProbar.disabled = false;

    sliderMasa = new window.UI.Slider({
      contenedor: controlesEl,
      etiqueta: 'Masa del peso',
      min: 5,
      max: 30,
      paso: 1,
      valorInicial: estado.masaPeso,
      unidad: 'kg',
      onChange: (valor) => {
        estado.masaPeso = valor;
        if (nivel === 'explorar') { estado.exploracionCount++; verificarDesbloqueoExplicacion(); }
      },
    });

    sliderPosicion = new window.UI.Slider({
      contenedor: controlesEl,
      etiqueta: 'Posición del peso (desde el apoyo izquierdo)',
      min: 0.2,
      max: 3.8,
      paso: 0.1,
      valorInicial: estado.posicionPeso,
      unidad: 'm',
      onChange: (valor) => {
        estado.posicionPeso = valor;
        if (nivel === 'explorar') { estado.exploracionCount++; verificarDesbloqueoExplicacion(); }
      },
    });
  }

  function actualizarMetaTexto() {
    if (estado.nivel === 'explorar') {
      metaTextoEl.textContent = `Modo libre: el tablón mide ${LONGITUD_TABLA} m y está apoyado en dos soportes, uno en cada extremo. Movés el peso y su posición.`;
    } else if (estado.nivel === 'desafio') {
      const cfg = NIVELES.desafio;
      metaTextoEl.textContent = `Meta: colocá el peso donde el apoyo derecho soporte el ${(cfg.fraccionObjetivoDerecha * 100).toFixed(0)}% del peso total.`;
    } else {
      const cfg = NIVELES.prediccion;
      metaTextoEl.textContent = `Un peso de ${cfg.masa} kg está casi pegado al apoyo derecho (a ${cfg.posicion} m de ${LONGITUD_TABLA} m). ¿Cómo se reparte la carga entre los dos apoyos?`;
    }
  }

  function reiniciarCorrida() {
    estado.fase = 'quieto';
    estado.prediccionJugador = null;
    estado.expresion = 'neutral';
    resultadoEl.textContent = '';
    resultadoEl.className = 'resultado';
    if (sliderMasa) sliderMasa.input.disabled = false;
    if (sliderPosicion) sliderPosicion.input.disabled = false;
    construirControles(estado.nivel);
  }

  function configurarNivel(nivel) {
    estado.nivel = nivel;
    reiniciarCorrida();
    actualizarMetaTexto();
  }

  function evaluarDesafio() {
    const cfg = NIVELES.desafio;
    const peso = estado.masaPeso * G;
    const fraccionDerecha = reaccionDerecha(estado.masaPeso, estado.posicionPeso) / peso;
    const exito = Math.abs(fraccionDerecha - cfg.fraccionObjetivoDerecha) <= cfg.tolerancia;

    if (exito) {
      resultadoEl.textContent = '¡Reparto exacto!';
      resultadoEl.className = 'resultado exito';
      estado.logroDesafio = true;
      estado.expresion = 'feliz';
      if (guia) { guia.decir('victory'); guia.celebrar(); }
      if (animacionFinal) animacionFinal.reproducir();
      verificarDesbloqueoExplicacion();
    } else {
      resultadoEl.textContent = fraccionDerecha > cfg.fraccionObjetivoDerecha
        ? 'El apoyo derecho está cargando de más. Acercá el peso al apoyo izquierdo.'
        : 'El apoyo derecho está cargando de menos. Acercá el peso al apoyo derecho.';
      resultadoEl.className = 'resultado fallo';
      estado.expresion = 'triste';
      estado.intentosFallidos++;
      if (guia && estado.intentosFallidos >= 2) guia.decir('multipleFailures');
    }
  }

  function evaluarPrediccion() {
    const cfg = NIVELES.prediccion;
    const peso = cfg.masa * G;
    const rDer = reaccionDerecha(cfg.masa, cfg.posicion);
    const rIzq = peso - rDer;
    const acerto = estado.prediccionJugador === 'cercano';

    const textoValores = `Apoyo izquierdo: ${rIzq.toFixed(1)} N. Apoyo derecho: ${rDer.toFixed(1)} N.`;

    if (acerto) {
      resultadoEl.textContent = `¡Correcto! ${textoValores} El apoyo más cercano al peso carga casi todo.`;
      resultadoEl.className = 'resultado exito';
      estado.logroPrediccion = true;
      estado.expresion = 'feliz';
      if (guia) { guia.decir('victory'); guia.celebrar(); }
      if (animacionFinal) animacionFinal.reproducir();
    } else {
      resultadoEl.textContent = `No: ${textoValores} La carga NO se reparte igual — el apoyo más cercano al peso soporta casi todo.`;
      resultadoEl.className = 'resultado fallo';
      estado.expresion = 'triste';
    }
    verificarDesbloqueoExplicacion();
  }

  function verificarDesbloqueoExplicacion() {
    const desbloqueado = estado.exploracionCount >= 6 || estado.logroDesafio || estado.logroPrediccion;
    if (desbloqueado) {
      btnExplicacion.classList.remove('oculto');
      if (guia && !estado.discoveryDicho) {
        estado.discoveryDicho = true;
        guia.decir('discovery');
      }
    }
  }

  function dibujarFondo(ctx, w, h) {
    ctx.fillStyle = '#325365';
    ctx.fillRect(0, 0, w, Y_PISO);
    ctx.fillStyle = '#507C74';
    ctx.fillRect(0, Y_PISO, w, h - Y_PISO);
  }

  function dibujarSoporte(ctx, x) {
    ctx.fillStyle = '#2B2520';
    ctx.beginPath();
    ctx.moveTo(x - 18, Y_PISO);
    ctx.lineTo(x + 18, Y_PISO);
    ctx.lineTo(x, Y_TABLA);
    ctx.closePath();
    ctx.fill();
  }

  function dibujarEscena() {
    dibujarFondo(ctxEscena, canvasEscena.width, canvasEscena.height);

    const masa = estado.nivel === 'prediccion' ? NIVELES.prediccion.masa : estado.masaPeso;
    const posicion = estado.nivel === 'prediccion' ? NIVELES.prediccion.posicion : estado.posicionPeso;
    const xDerPx = X_IZQ_PX + LONGITUD_TABLA * ESCALA_PX_POR_M;

    dibujarSoporte(ctxEscena, X_IZQ_PX);
    dibujarSoporte(ctxEscena, xDerPx);

    ctxEscena.fillStyle = '#5A3E26';
    ctxEscena.fillRect(X_IZQ_PX - 10, Y_TABLA - 6, xDerPx - X_IZQ_PX + 20, 12);

    const xPesoPx = X_IZQ_PX + posicion * ESCALA_PX_POR_M;
    const anchoPeso = 16 + masa * 1.2;

    const colorPeso = estado.expresion === 'feliz' ? '#4CAF50'
      : estado.expresion === 'triste' ? '#B52121'
      : window.Utilidades.TEMA_CATEGORIAS.mecanica;
    ctxEscena.fillStyle = colorPeso;
    ctxEscena.fillRect(xPesoPx - anchoPeso / 2, Y_TABLA - 6 - anchoPeso, anchoPeso, anchoPeso);

    const rIzq = reaccionIzquierda(masa, posicion);
    const rDer = reaccionDerecha(masa, posicion);
    panelMetricas.actualizar('apoyoIzq', rIzq.toFixed(1));
    panelMetricas.actualizar('apoyoDer', rDer.toFixed(1));
  }

  const loop = new window.Motor.GameLoop({
    actualizar() {},
    dibujar: dibujarEscena,
  });

  new window.UI.SelectorNivel({
    contenedor: document.getElementById('contenedorNivel'),
    onCambio: configurarNivel,
  });

  btnProbar.addEventListener('click', () => {
    if (estado.fase === 'evaluado') return;
    if (estado.nivel === 'prediccion' && !estado.prediccionJugador) return;

    estado.fase = 'evaluado';
    resultadoEl.textContent = '';
    resultadoEl.className = 'resultado';
    if (sliderMasa) sliderMasa.input.disabled = true;
    if (sliderPosicion) sliderPosicion.input.disabled = true;

    if (estado.nivel === 'desafio') evaluarDesafio();
    if (estado.nivel === 'prediccion') evaluarPrediccion();
  });

  btnReiniciar.addEventListener('click', reiniciarCorrida);

  const modalAyuda = new window.UI.ModalAyuda({
    pregunta: 'Un tablón apoyado en dos soportes, con un peso encima. ¿Los dos soportes cargan siempre lo mismo, sin importar dónde esté el peso?',
    controles: 'En Explorar y Desafío, movés la masa y la posición del peso, y apretás Probar. En Predicción, elegís tu respuesta primero.',
    pista: 'Movés el peso bien cerca de un extremo y mirá qué pasa con los dos números del panel.',
  });

  document.getElementById('btnAyuda').addEventListener('click', () => modalAyuda.mostrar());

  const modalExplicacion = new window.UI.ModalExplicacion({
    ley: 'Equilibrio estático de un cuerpo apoyado',
    formula: 'Fuerza neta = 0 &nbsp;Y&nbsp; Torque neto = 0 &nbsp;·&nbsp; R_derecha = P·x/L',
    analogia: 'El tablón sobre dos soportes representa cualquier estructura apoyada en más de un punto: un puente, una viga, una tabla de surf apoyada en dos caballetes.',
    limitesAnalogia: 'Se supone que el tablón es rígido y no se flexiona — en la realidad los materiales reales se deforman levemente bajo carga, lo que puede cambiar un poco el reparto exacto.',
    erroresComunes: 'Un cuerpo en equilibrio estático necesita fuerza neta CERO y torque neto CERO al mismo tiempo — no alcanza con una sola condición. Por eso la carga no se reparte igual entre los dos apoyos: el más cercano al peso soporta más, en proporción directa a la distancia.',
  });

  const btnExplicacion = document.createElement('button');
  btnExplicacion.className = 'boton oculto';
  btnExplicacion.textContent = 'Ver la explicación científica';
  btnExplicacion.addEventListener('click', () => modalExplicacion.mostrar());
  document.querySelector('.acciones').appendChild(btnExplicacion);

  function iniciarJuego() {
    guia = new window.UI.PersonajeGuia({
      contenedor: document.body,
      dialogos: {
        gameStart: ['Movés el peso a lo largo del tablón y mirás cómo se reparte la carga.'],
        victory: ['¡Justo el reparto buscado!', '¡Como calcularía un ingeniero de puentes!'],
        multipleFailures: ['Pista: el apoyo más cercano al peso siempre carga más.', '¿Probaste mover el peso bien cerca de un extremo?'],
        discovery: ['¡Gran hallazgo! Ya podés ver la explicación científica.'],
      },
    });
    animacionFinal = new window.UI.AnimacionFinal();

    configurarNivel('explorar');
    loop.iniciar();
  }

  new window.UI.EscenaIntro({
    titulo: 'El Tablón en Equilibrio',
    contextoHistorico: 'En 1687, el matemático francés Pierre Varignon formalizó las condiciones completas del equilibrio estático: un cuerpo está en reposo solo si la fuerza neta Y el torque neto son exactamente cero al mismo tiempo — no alcanza con una sola de las dos condiciones. Esa idea es la base de cómo los ingenieros calculan cuánto peso soporta cada apoyo de un puente o una viga.',
    dibujarFondo: dibujarFondo,
    onComenzar: iniciarJuego,
  });
})();

</script>
