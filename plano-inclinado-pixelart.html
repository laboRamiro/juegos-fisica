<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Rampa de Galileo — Pixel Art</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
    body {
      background: #0a0818;
      color: #fff;
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    #game-wrapper { width: 100%; max-width: 1060px; }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 12px 0;
    }
    #header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: #FFD700;
      text-shadow: 2px 2px 0 #7A3B00, 4px 4px 0 #000;
    }
    #round-indicator { font-size: 1.4rem; color: #aaaaaa; }
    #round-num { color: #FFD700; }
    #main-area { display: flex; gap: 16px; align-items: flex-start; }
    #gameCanvas {
      display: block;
      border: 4px solid #FFD700;
      box-shadow: 4px 4px 0 #000, 6px 6px 0 #7A3B00;
      flex-shrink: 0;
    }
    #metrics-panel {
      background: #0a0818;
      border: 3px solid #FFD700;
      box-shadow: 3px 3px 0 #000;
      padding: 12px;
      min-width: 200px;
      flex: 1;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 2px solid #222244;
    }
    .metric-label { color: #8888cc; font-size: 1.1rem; }
    .metric-value { color: #fff; font-size: 1.2rem; font-family: 'Press Start 2P', monospace; font-size: 0.65rem; }
    #result-panel {
      margin-top: 12px;
      text-align: center;
      padding: 10px;
      background: #120020;
      border: 2px solid #FFD700;
    }
    #result-category {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    #result-detail { font-size: 1rem; color: #aaaaaa; margin-bottom: 12px; }
    #btn-next, #btn-restart {
      background: #FFD700;
      color: #0a0818;
      border: none;
      padding: 8px 16px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
    }
    #btn-next:hover, #btn-restart:hover {
      transform: translate(1px,1px);
      box-shadow: 2px 2px 0 #000;
    }
    #gameover-panel { margin-top: 12px; text-align: center; padding: 14px; }
    #gameover-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #FFD700;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #000;
    }
    #controls {
      display: flex; gap: 20px;
      align-items: center;
      padding: 14px 0 4px 0;
      flex-wrap: wrap;
    }
    .slider-group { display: flex; align-items: center; gap: 8px; }
    .slider-group label { color: #8888cc; font-size: 1.1rem; min-width: 80px; }
    input[type="range"] {
      -webkit-appearance: none; width: 160px; height: 8px;
      background: #222244; outline: none; border: 2px solid #555588;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: #FFD700; cursor: pointer;
      box-shadow: 2px 2px 0 #000;
    }
    input[type="range"]:disabled { opacity: 0.4; }
    .slider-group span { color: #FFD700; min-width: 50px; font-size: 1.3rem; }
    #btn-release {
      background: #FFD700;
      color: #0a0818;
      border: none;
      padding: 10px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      letter-spacing: 0.05em;
    }
    #btn-release:hover:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
    #btn-release:disabled { opacity: 0.4; }
  </style>
</head>
<body>
<div id="game-wrapper">
  <div id="header">
    <h1>La Rampa de Galileo</h1>
    <div id="round-indicator">RONDA <span id="round-num">1</span>/5</div>
  </div>
  <div id="main-area">
    <canvas id="gameCanvas" width="800" height="480"></canvas>
    <div id="metrics-panel">
      <div class="metric-row">
        <span class="metric-label">Ángulo θ</span>
        <span class="metric-value" id="display-theta">45°</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Altura h</span>
        <span class="metric-value" id="display-h">1.5m</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">d predicho</span>
        <span class="metric-value" id="display-d-pred">--</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Target</span>
        <span class="metric-value" id="display-target">3.0m</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Estado</span>
        <span class="metric-value" id="display-condition">--</span>
      </div>
      <div id="result-panel" style="display:none;">
        <div id="result-category"></div>
        <div id="result-detail"></div>
        <button id="btn-next">SIGUIENTE &gt;</button>
      </div>
      <div id="gameover-panel" style="display:none;">
        <div id="gameover-title">COMPLETO!</div>
        <div id="gameover-detail"></div>
        <button id="btn-restart">REINICIAR</button>
      </div>
    </div>
  </div>
  <p style="font-size:1rem;color:#444466;padding:6px 0 2px 0;">
    Simplificaciones: sin rodadura · μ uniforme · la masa no afecta d (Galileo)
  </p>
  <div id="controls">
    <div class="slider-group">
      <label for="slider-theta">θ</label>
      <input type="range" id="slider-theta" min="15" max="70" step="1" value="45">
      <span id="val-theta">45°</span>
    </div>
    <div class="slider-group">
      <label for="slider-h">h</label>
      <input type="range" id="slider-h" min="0.5" max="4.0" step="0.1" value="1.5">
      <span id="val-h">1.5m</span>
    </div>
    <button id="btn-release">▶ SOLTAR</button>
  </div>
</div>
<script>
// =====================================================
// === CONSTANTS ===
// =====================================================
const CANVAS_W      = 800;
const CANVAS_H      = 480;
const PX_PER_M      = 80;
const CRATE_SIZE_PX = 54;
const GRAVITY_MS2   = 10;
const MU_S          = 0.4;
const MU_K          = 0.3;
const RAMP_FOOT_X   = 220;
const FLOOR_Y       = 380;
const FIXED_DT      = 1 / 60;

// =====================================================
// === THEME — PIXEL ART RETRO (16-bit SNES) ===
// =====================================================
const THEME = {
  bg:            '#0a0818',
  groundFill:    '#5C3012',
  get rampFill() { return this.groundFill; },
  slopeLine:     '#FFD700',
  crateBody:     '#A0522D',
  crateStrap:    '#FFD700',
  crateRivet:    '#FFFF99',
  forceWeight:   '#FF4444',
  forceNormal:   '#00FFCC',
  forceFriction: '#FF66FF',
  targetRing:    '#FFD700',
  targetPulse:   'rgba(255,215,0,0.25)',
  accent:        '#FFD700',
  textPrimary:   '#FFFFFF',
  textSecondary: '#8888CC',
  panelBg:       'rgba(0,0,0,0.85)',
  colorPerfecto: '#FFD700',
  colorCorto:    '#00FFCC',
  colorPasado:   '#FF4444',
  colorNoMueve:  '#888888',
  // pixel-art specific
  skyTop:        '#0a0818',
  skyBottom:     '#1a0840',
  hillColor:     '#2a1244',
  moonColor:     '#FFFFCC',
};

// =====================================================
// === STATE ===
// =====================================================
const STATE = {
  theta_deg: 45, h_m: 1.5, phase: 'idle',
  crateX_m: 0, crateY_m: 0, vel_ms: 0, dist_floor_m: 0,
  roundIdx: 0, result: null, theta_display_deg: 45,
  dustParticles: [], t: 0, ramp_s_m: 0, ramp_L_m: 0, ramp_a1: 0,
};

const ROUNDS = [
  { target_m: 3.0, tol_m: 0.5 },
  { target_m: 4.5, tol_m: 0.4 },
  { target_m: 6.0, tol_m: 0.3 },
  { target_m: 5.5, tol_m: 0.2 },
  { target_m: 7.0, tol_m: 0.1 },
];

// =====================================================
// === PHYSICS (idéntica al original) ===
// =====================================================
function willMove(theta_deg) {
  return Math.tan(theta_deg * Math.PI / 180) > MU_S;
}
function computePreview(theta_deg, h_m) {
  if (!willMove(theta_deg)) return null;
  const r = theta_deg * Math.PI / 180;
  return h_m * (Math.sin(r) - MU_K * Math.cos(r)) / (MU_K * Math.sin(r));
}
function updateCratePositionOnRamp(s_m) {
  const r = STATE.theta_deg * Math.PI / 180;
  const x_top = -STATE.h_m / Math.tan(r);
  STATE.crateX_m = x_top + s_m * Math.cos(r);
  STATE.crateY_m = STATE.h_m - s_m * Math.sin(r);
}
function updateCratePositionOnFloor(dist_m) {
  STATE.crateX_m = dist_m;
  STATE.crateY_m = 0;
}
function initPhysics() {
  if (!willMove(STATE.theta_deg)) {
    STATE.phase = 'idle'; STATE.vel_ms = 0; STATE.dist_floor_m = 0;
    document.dispatchEvent(new CustomEvent('crate-stopped')); return;
  }
  const r = STATE.theta_deg * Math.PI / 180;
  STATE.phase = 'ramp'; STATE.vel_ms = 0; STATE.ramp_s_m = 0;
  STATE.ramp_L_m = STATE.h_m / Math.sin(r);
  STATE.ramp_a1  = GRAVITY_MS2 * (Math.sin(r) - MU_K * Math.cos(r));
  STATE.dist_floor_m = 0;
  updateCratePositionOnRamp(0);
}
function stepPhysics(dt) {
  if (STATE.phase === 'ramp') {
    STATE.vel_ms   += STATE.ramp_a1 * dt;
    STATE.ramp_s_m += STATE.vel_ms * dt;
    updateCratePositionOnRamp(STATE.ramp_s_m);
    if (STATE.ramp_s_m >= STATE.ramp_L_m) {
      STATE.ramp_s_m = STATE.ramp_L_m;
      updateCratePositionOnRamp(STATE.ramp_s_m);
      STATE.phase = 'floor'; STATE.dist_floor_m = 0;
    }
  } else if (STATE.phase === 'floor') {
    STATE.vel_ms -= MU_K * GRAVITY_MS2 * dt;
    if (STATE.vel_ms <= 0) {
      STATE.vel_ms = 0; STATE.phase = 'stopped';
      updateCratePositionOnFloor(STATE.dist_floor_m);
      if (typeof spawnDustBurst === 'function') spawnDustBurst(STATE);
      document.dispatchEvent(new CustomEvent('crate-stopped')); return;
    }
    STATE.dist_floor_m += STATE.vel_ms * dt;
    updateCratePositionOnFloor(STATE.dist_floor_m);
  }
}

// =====================================================
// === ARTIST — PIXEL ART ===
// =====================================================
function worldToCanvas(x_m, y_m) {
  return { px: RAMP_FOOT_X + x_m * PX_PER_M, py: FLOOR_Y - y_m * PX_PER_M };
}

function snap(v) { return Math.round(v); } // pixel-perfect snapping

function initArtist() {
  // Pixel stars: grid with some randomness
  window.PIXEL_STARS = [];
  const rng = (s) => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
  for (let i = 0; i < 80; i++) {
    window.PIXEL_STARS.push({
      x: snap(rng(i * 3.1) * CANVAS_W),
      y: snap(rng(i * 7.3) * (FLOOR_Y - 20)),
      bright: rng(i * 1.7) > 0.7,
    });
  }
  // Pixel moon
  window.MOON = { x: 680, y: 60, r: 18 };
}

function drawBackground(ctx) {
  // Sky gradient — done with horizontal bands (pixel style)
  for (let y = 0; y < FLOOR_Y; y += 2) {
    const t = y / FLOOR_Y;
    const r = Math.round(10 + t * 16);
    const g = Math.round(8 + t * 4);
    const b = Math.round(24 + t * 40);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, CANVAS_W, 2);
  }

  // Moon (pixel circle)
  ctx.fillStyle = THEME.moonColor;
  const m = window.MOON;
  for (let dy = -m.r; dy <= m.r; dy++) {
    for (let dx = -m.r; dx <= m.r; dx++) {
      if (dx*dx + dy*dy <= m.r*m.r) {
        ctx.fillRect(snap(m.x + dx), snap(m.y + dy), 1, 1);
      }
    }
  }
  // Moon shadow (crescent)
  ctx.fillStyle = THEME.bg;
  for (let dy = -m.r; dy <= m.r; dy++) {
    for (let dx = -m.r + 6; dx <= m.r + 4; dx++) {
      if (dx*dx + dy*dy <= m.r*m.r) {
        ctx.fillRect(snap(m.x + dx), snap(m.y + dy), 1, 1);
      }
    }
  }

  // Pixel stars
  window.PIXEL_STARS.forEach(s => {
    ctx.fillStyle = s.bright ? '#FFFFEE' : '#888899';
    ctx.fillRect(s.x, s.y, s.bright ? 2 : 1, s.bright ? 2 : 1);
  });

  // Pixel hills (background decoration)
  ctx.fillStyle = THEME.hillColor;
  const hills = [[0,340,200,80],[120,350,160,60],[400,345,220,70],[580,352,180,55],[700,348,200,65]];
  hills.forEach(([x,y,w,h]) => {
    for (let dx = 0; dx < w; dx++) {
      const t = dx / w;
      const hy = y + h - Math.round(h * 4 * t * (1 - t));
      ctx.fillRect(snap(x + dx), snap(hy), 1, FLOOR_Y - hy);
    }
  });
}

function drawFloor(ctx) {
  // Base fill — mismo color que la rampa
  ctx.fillStyle = THEME.groundFill;
  ctx.fillRect(0, FLOOR_Y, CANVAS_W, CANVAS_H - FLOOR_Y);

  // Mismo dithering claro que el ramp face (pattern idéntico)
  for (let x = 0; x < CANVAS_W; x += 2) {
    for (let y = 0; y < 8; y += 2) {
      if ((x + (FLOOR_Y + y)) % 4 === 0) {
        ctx.fillStyle = '#7A4020';
        ctx.fillRect(x, FLOOR_Y + y, 2, 2);
      }
    }
  }

  // Pixel ground tiles
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  for (let x = 0; x < CANVAS_W; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, FLOOR_Y); ctx.lineTo(x, CANVAS_H); ctx.stroke();
  }
  for (let y = FLOOR_Y + 16; y < CANVAS_H; y += 16) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
  }
}

function drawRamp(ctx, STATE) {
  const r    = STATE.theta_display_deg * Math.PI / 180;
  const h_px = STATE.h_m * PX_PER_M;
  const footX = RAMP_FOOT_X, footY = FLOOR_Y;
  const topX = snap(RAMP_FOOT_X - h_px / Math.tan(r));
  const topY = snap(FLOOR_Y - h_px);

  // Ramp fill — mismo color y dithering que el piso → suelo continuo
  ctx.fillStyle = THEME.groundFill;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(0, topY);
  ctx.lineTo(topX, topY);
  ctx.lineTo(footX, footY);
  ctx.closePath();
  ctx.fill();

  // Mismo dithering claro que el piso (idéntico al strip del drawFloor)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y); ctx.lineTo(0, topY);
  ctx.lineTo(topX, topY); ctx.lineTo(footX, footY);
  ctx.closePath(); ctx.clip();
  for (let x = 0; x <= footX; x += 2) {
    for (let y = topY; y <= FLOOR_Y + 8; y += 2) {
      if ((x + y) % 4 === 0) {
        ctx.fillStyle = '#7A4020';
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }
  ctx.restore();

  // Pixel slope line
  ctx.strokeStyle = THEME.slopeLine;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(topX, topY); ctx.lineTo(footX, footY);
  ctx.stroke();
  // Double pixel border effect
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(topX+1, topY+1); ctx.lineTo(footX+1, footY+1);
  ctx.stroke();

  // Angle arc
  ctx.strokeStyle = THEME.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(footX, footY, 28, r - Math.PI, Math.PI, true);
  ctx.stroke();
  const midA = r / 2 - Math.PI;
  ctx.fillStyle = THEME.accent;
  ctx.font = '13px serif';
  ctx.textAlign = 'center';
  ctx.fillText('θ', footX + 40 * Math.cos(midA), footY + 40 * Math.sin(midA));
  ctx.textAlign = 'left';
}

function drawTarget(ctx, STATE) {
  const round = ROUNDS[STATE.roundIdx];
  const tx = snap(RAMP_FOOT_X + round.target_m * PX_PER_M);
  const ty = FLOOR_Y;

  // Tolerance zone (dithered)
  const tolPx = Math.round(round.tol_m * PX_PER_M);
  for (let x = tx - tolPx; x < tx + tolPx; x += 2) {
    for (let y = FLOOR_Y; y < CANVAS_H; y += 2) {
      if ((x + y) % 4 === 0) {
        ctx.fillStyle = 'rgba(255,215,0,0.18)';
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }

  // Pixel pulsing ring (stepped)
  const pulse = Math.round((Math.sin(STATE.t * Math.PI * 2) + 1) * 5);
  ctx.strokeStyle = THEME.targetRing;
  ctx.lineWidth = 2;
  for (let r2 = 10 + pulse; r2 <= 14 + pulse; r2 += 2) {
    ctx.beginPath();
    ctx.arc(tx, ty, r2, Math.PI, Math.PI * 2);
    ctx.stroke();
  }

  // Pixel dot
  ctx.fillStyle = THEME.accent;
  ctx.fillRect(tx - 3, ty - 3, 6, 6);

  // Pixel flag pole
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(tx - 1, ty - 42, 2, 42);

  // Pixel flag
  ctx.fillStyle = '#FF2200';
  ctx.fillRect(tx + 1, ty - 42, 14, 8);
  ctx.fillStyle = '#FF6644';
  ctx.fillRect(tx + 1, ty - 40, 12, 4);

  // Pixel label
  ctx.fillStyle = THEME.accent;
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(round.target_m.toFixed(1)+'m', tx, ty - 50);
  ctx.textAlign = 'left';
}

function drawCrate(ctx, xPx, yPx, sizePx) {
  // Pixel-art wooden crate
  const P = 2; // pixel size
  const half = Math.round(sizePx / 2);
  const top  = Math.round(yPx - sizePx);
  const x0   = Math.round(xPx - half);

  // Body
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x0, top, sizePx, sizePx);

  // Highlight top strip
  ctx.fillStyle = '#A0632A';
  ctx.fillRect(x0, top, sizePx, P*2);

  // Shadow bottom strip
  ctx.fillStyle = '#5C2800';
  ctx.fillRect(x0, top + sizePx - P*2, sizePx, P*2);

  // X braces (pixel)
  ctx.fillStyle = '#FFD700';
  ctx.lineWidth = P;
  // Diagonal 1
  for (let i = 0; i < sizePx; i += P) {
    const bx = x0 + Math.round(i * sizePx / sizePx / P) * P;
    const by = top + i;
    if (bx >= x0 && bx < x0+sizePx) ctx.fillRect(bx, by, P, P);
  }
  // Diagonal 2
  for (let i = 0; i < sizePx; i += P) {
    const bx = x0 + sizePx - Math.round(i) - P;
    const by = top + i;
    if (bx >= x0 && bx < x0+sizePx) ctx.fillRect(bx, by, P, P);
  }

  // Horizontal plank lines
  ctx.fillStyle = '#3A1A00';
  ctx.fillRect(x0, top + Math.round(sizePx/3), sizePx, P);
  ctx.fillRect(x0, top + Math.round(sizePx*2/3), sizePx, P);

  // Border
  ctx.strokeStyle = '#000';
  ctx.lineWidth = P;
  ctx.strokeRect(x0 + 1, top + 1, sizePx - 2, sizePx - 2);

  // Corner rivets (pixel)
  ctx.fillStyle = '#FFFF99';
  [[x0+2, top+2],[x0+sizePx-4, top+2],[x0+2, top+sizePx-4],[x0+sizePx-4, top+sizePx-4]].forEach(([cx,cy])=>{
    ctx.fillRect(cx, cy, 3, 3);
  });
}

function drawCrateInScene(ctx, STATE) {
  const pos = worldToCanvas(STATE.crateX_m, STATE.crateY_m);
  const r   = STATE.theta_deg * Math.PI / 180;
  if (STATE.phase === 'ramp' || STATE.phase === 'idle') {
    ctx.save();
    ctx.translate(snap(pos.px), snap(pos.py));
    ctx.rotate(r);
    drawCrate(ctx, 0, 0, CRATE_SIZE_PX);
    ctx.restore();
  } else {
    drawCrate(ctx, snap(pos.px), snap(pos.py), CRATE_SIZE_PX);
  }
}

function crateCenterPx(STATE) {
  const pos  = worldToCanvas(STATE.crateX_m, STATE.crateY_m);
  const half = CRATE_SIZE_PX / 2;
  const r    = STATE.theta_deg * Math.PI / 180;
  if (STATE.phase === 'ramp' || STATE.phase === 'idle') {
    return { cx: pos.px + half * Math.sin(r), cy: pos.py - half * Math.cos(r) };
  }
  return { cx: pos.px, cy: pos.py - half };
}

function drawForceVector(ctx, xPx, yPx, dirX, dirY, magnitudeN, maxN, color, label, maxLen) {
  if (magnitudeN <= 0) return;
  maxLen = maxLen || 60;
  const len = Math.max(22, (magnitudeN / maxN) * maxLen);
  const xEnd = xPx + dirX * len, yEnd = yPx + dirY * len;
  const hLen = Math.min(8, len * 0.4);
  const bx = xEnd - dirX * hLen, by = yEnd - dirY * hLen;
  const px = -dirY, py = dirX;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  // Pixel-style arrow (stepped)
  ctx.beginPath(); ctx.moveTo(xPx, yPx); ctx.lineTo(bx, by); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(xEnd, yEnd);
  ctx.lineTo(bx + px*5, by + py*5);
  ctx.lineTo(bx - px*5, by - py*5);
  ctx.closePath(); ctx.fill();
  ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = color;
  ctx.fillText(label, xEnd + dirX*8 - 3, yEnd + dirY*8 + 3);
  ctx.restore();
}

function drawForceDiagram(ctx, STATE) {
  if (STATE.phase === 'stopped') return;
  const { cx, cy } = crateCenterPx(STATE);
  const r = STATE.theta_deg * Math.PI / 180;
  const MASS = 1.5, maxN = 15, maxLen = 60;
  if (STATE.phase === 'ramp' || STATE.phase === 'idle') {
    const w = MASS * GRAVITY_MS2, N = w * Math.cos(r), f = MU_K * N;
    drawForceVector(ctx, cx, cy, 0, +1, w, maxN, THEME.forceWeight, 'P', maxLen);
    drawForceVector(ctx, cx, cy, +Math.sin(r), -Math.cos(r), N, maxN, THEME.forceNormal, 'N', maxLen);
    if (f > 0) drawForceVector(ctx, cx, cy, -Math.cos(r), -Math.sin(r), f, maxN, THEME.forceFriction, 'f', maxLen);
  } else if (STATE.phase === 'floor') {
    const w = MASS * GRAVITY_MS2, N = w, f = MU_K * N;
    drawForceVector(ctx, cx, cy, 0, +1, w, maxN, THEME.forceWeight, 'P', maxLen);
    drawForceVector(ctx, cx, cy, 0, -1, N, maxN, THEME.forceNormal, 'N', maxLen);
    if (f > 0) drawForceVector(ctx, cx, cy, -1, 0, f, maxN, THEME.forceFriction, 'f', maxLen);
  }
}

function spawnDustBurst(STATE) {
  const pos = worldToCanvas(STATE.crateX_m, STATE.crateY_m);
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI;
    STATE.dustParticles.push({
      x: snap(pos.px + (Math.random()-0.5)*CRATE_SIZE_PX),
      y: pos.py,
      vx: Math.round(Math.cos(angle)*3), vy: -Math.round(Math.sin(angle)*3),
      life: 1.0, r: 2,
    });
  }
}
function updateDust(dt) {
  STATE.dustParticles = STATE.dustParticles.filter(p => p.life > 0);
  STATE.dustParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.03;
  });
}
function drawDust(ctx, STATE) {
  STATE.dustParticles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#D4893A';
    ctx.fillRect(snap(p.x), snap(p.y), 3, 3);
  });
  ctx.globalAlpha = 1;
}

function drawScene(ctx, STATE) {
  drawBackground(ctx);
  drawFloor(ctx);
  drawRamp(ctx, STATE);
  drawTarget(ctx, STATE);
  drawCrateInScene(ctx, STATE);
  drawForceDiagram(ctx, STATE);
  drawDust(ctx, STATE);
}

// =====================================================
// === UI (idéntica al original) ===
// =====================================================
function initUI() {
  window.UI = {
    sliderTheta: document.getElementById('slider-theta'),
    sliderH: document.getElementById('slider-h'),
    valTheta: document.getElementById('val-theta'),
    valH: document.getElementById('val-h'),
    btnRelease: document.getElementById('btn-release'),
    btnNext: document.getElementById('btn-next'),
    btnRestart: document.getElementById('btn-restart'),
    displayTheta: document.getElementById('display-theta'),
    displayH: document.getElementById('display-h'),
    displayDPred: document.getElementById('display-d-pred'),
    displayTarget: document.getElementById('display-target'),
    displayCond: document.getElementById('display-condition'),
    roundNum: document.getElementById('round-num'),
    resultPanel: document.getElementById('result-panel'),
    resultCategory: document.getElementById('result-category'),
    resultDetail: document.getElementById('result-detail'),
    gameoverPanel: document.getElementById('gameover-panel'),
    gameoverDetail: document.getElementById('gameover-detail'),
  };
  UI.sliderTheta.addEventListener('input', onSliderChange);
  UI.sliderH.addEventListener('input', onSliderChange);
  UI.btnRelease.addEventListener('click', () => document.dispatchEvent(new CustomEvent('crate-released')));
  UI.btnNext.addEventListener('click', () => document.dispatchEvent(new CustomEvent('round-next')));
  UI.btnRestart.addEventListener('click', () => location.reload());
  document.addEventListener('keydown', e => {
    if (e.code==='Space' && !UI.btnRelease.disabled){ e.preventDefault(); document.dispatchEvent(new CustomEvent('crate-released')); }
    if (e.key==='R'||e.key==='r') location.reload();
    if (e.key==='ArrowUp'&&!UI.sliderTheta.disabled){ e.preventDefault(); UI.sliderTheta.value=Math.min(+UI.sliderTheta.value+1,70); onSliderChange(); }
    if (e.key==='ArrowDown'&&!UI.sliderTheta.disabled){ e.preventDefault(); UI.sliderTheta.value=Math.max(+UI.sliderTheta.value-1,15); onSliderChange(); }
  });
  onSliderChange();
}
function onSliderChange() {
  STATE.theta_deg = +UI.sliderTheta.value;
  STATE.h_m       = +UI.sliderH.value;
  UI.valTheta.textContent = STATE.theta_deg + '°';
  UI.valH.textContent     = STATE.h_m.toFixed(1) + 'm';
  if (STATE.phase === 'idle') initCratePosition();
  updateMetricsPanel();
}
function updateMetricsPanel() {
  UI.displayTheta.textContent = STATE.theta_deg + '°';
  UI.displayH.textContent     = STATE.h_m.toFixed(1) + 'm';
  const round = ROUNDS[STATE.roundIdx];
  UI.displayTarget.textContent = round.target_m.toFixed(1) + 'm ±' + round.tol_m.toFixed(1);
  const d = computePreview(STATE.theta_deg, STATE.h_m);
  if (!d) { UI.displayDPred.textContent = '--'; UI.displayCond.textContent = 'NO MUEVE'; UI.displayCond.style.color = THEME.colorNoMueve; return; }
  UI.displayDPred.textContent = d.toFixed(2) + 'm';
  if (Math.abs(d - round.target_m) <= round.tol_m) { UI.displayCond.textContent = 'PERFECTO'; UI.displayCond.style.color = THEME.colorPerfecto; }
  else if (d < round.target_m) { UI.displayCond.textContent = 'CORTO'; UI.displayCond.style.color = THEME.colorCorto; }
  else { UI.displayCond.textContent = 'PASADO'; UI.displayCond.style.color = THEME.colorPasado; }
}
function setRoundDisplay(idx) { UI.roundNum.textContent = idx+1; updateMetricsPanel(); }
function showResult(cat, d, tgt) {
  const L={'no_se_mueve':'NO SE MUEVE','corto':'CORTO','perfecto':'PERFECTO!','pasado':'PASADO'};
  const C={'no_se_mueve':THEME.colorNoMueve,'corto':THEME.colorCorto,'perfecto':THEME.colorPerfecto,'pasado':THEME.colorPasado};
  UI.resultCategory.textContent = L[cat]; UI.resultCategory.style.color = C[cat];
  if (cat==='no_se_mueve') UI.resultDetail.textContent='tanθ ≤ μs — no arranca.';
  else if (cat==='perfecto') UI.resultDetail.textContent='d='+d.toFixed(2)+'m — EN EL BLANCO!';
  else if (cat==='corto') UI.resultDetail.textContent='d='+d.toFixed(2)+'m — faltaron '+(tgt-d).toFixed(2)+'m';
  else UI.resultDetail.textContent='d='+d.toFixed(2)+'m — pasó '+(d-tgt).toFixed(2)+'m';
  UI.resultPanel.style.display='block';
  UI.btnNext.style.display = STATE.roundIdx>=ROUNDS.length-1?'none':'';
}
function hideResult() { UI.resultPanel.style.display='none'; }
function showGameOver() {
  UI.resultPanel.style.display='none'; UI.gameoverPanel.style.display='block';
  UI.gameoverDetail.textContent='5 rondas completadas. GAME CLEAR!';
}
function setControlsEnabled(en) { UI.sliderTheta.disabled=!en; UI.sliderH.disabled=!en; UI.btnRelease.disabled=!en; }

// Audio
let audioCtx = null;
function initAudio() {
  document.addEventListener('click', ()=>{ try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} }, {once:true});
}
function playSlide() {
  if (!audioCtx) return;
  try {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=200; g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
  } catch(e) {}
}
function playImpact() {
  if (!audioCtx) return;
  try {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.setValueAtTime(150,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.2);
    g.gain.setValueAtTime(0.3,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.25);
  } catch(e) {}
}
function playPerfect() {
  if (!audioCtx) return;
  try {
    [523,659,784,1047].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(0,audioCtx.currentTime+i*0.08);
      g.gain.linearRampToValueAtTime(0.15,audioCtx.currentTime+i*0.08+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.08+0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+i*0.08); o.stop(audioCtx.currentTime+i*0.08+0.5);
    });
  } catch(e) {}
}

let lastTime = null;
function gameLoop(ts) {
  const dt = lastTime===null?0:Math.min((ts-lastTime)/1000,0.05);
  lastTime = ts;
  STATE.t += dt;
  STATE.theta_display_deg += (STATE.theta_deg - STATE.theta_display_deg)*0.12;
  if (STATE.phase==='ramp'||STATE.phase==='floor') stepPhysics(dt);
  updateDust(dt);
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawScene(ctx, STATE);
  requestAnimationFrame(gameLoop);
}

function evaluateResult(d, target, tol) {
  if (!willMove(STATE.theta_deg)) return 'no_se_mueve';
  if (Math.abs(d-target)<=tol) return 'perfecto';
  if (d<target-tol) return 'corto';
  return 'pasado';
}
function initCratePosition() {
  const r = STATE.theta_deg * Math.PI / 180;
  STATE.crateX_m = -STATE.h_m / Math.tan(r);
  STATE.crateY_m = STATE.h_m;
}
function resetRound() {
  STATE.phase='idle'; STATE.vel_ms=0; STATE.dist_floor_m=0;
  STATE.result=null; STATE.dustParticles=[];
  initCratePosition(); setRoundDisplay(STATE.roundIdx);
}
document.addEventListener('crate-released', ()=>{
  if (STATE.phase==='ramp'||STATE.phase==='floor') return;
  initPhysics(); setControlsEnabled(false); playSlide();
});
document.addEventListener('crate-stopped', ()=>{
  const r=ROUNDS[STATE.roundIdx];
  const cat=evaluateResult(STATE.dist_floor_m, r.target_m, r.tol_m);
  STATE.result=cat; showResult(cat, STATE.dist_floor_m, r.target_m);
  playImpact(); if(cat==='perfecto') setTimeout(playPerfect,150);
});
document.addEventListener('round-next', ()=>{
  hideResult();
  if (STATE.roundIdx<ROUNDS.length-1){ STATE.roundIdx++; resetRound(); setControlsEnabled(true); }
  else showGameOver();
});

function init() {
  const canvas = document.getElementById('gameCanvas');
  window.ctx = canvas.getContext('2d');
  initArtist(); initUI(); initAudio();
  initCratePosition(); setRoundDisplay(0); updateMetricsPanel();
  requestAnimationFrame(gameLoop);
}
window.onload = init;
</script>
